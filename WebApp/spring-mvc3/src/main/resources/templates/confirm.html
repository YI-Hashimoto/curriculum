<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width,initial-scale=1">
	<link th:href="@{/webjars/bootstrap/css/bootstrap.min.css}" rel="stylesheet">
	<title>Title</title>
</head>

<body class="bg-body-tertiary">
	<div class="container">
		<div class="row justify-content-center">
			<div class="col-md-8">
				<h3 class="border-bottom my-3" th:text="#{invoice}"></h3>

				<p class="text-danger" th:text="#{confirmationMessage}"></p>
				<div th:object="${invoice}">
					<div class="md-3">
						<label for="name" th:text="#{name}"></label>
						<input type="text" th:field="*{name}" class="form-control" disabled>
					</div>

					<div class="md-3">
						<label for="address" th:text="#{address}"></label>
						<input type="text" th:field="*{address}" class="form-control" disabled>
					</div>

					<div class="md-3">
						<label for="phoneNumber" th:text="#{phoneNumber"></label>
						<input type="tel" th:field="*{phoneNumber}" class="form-control" disabled>
					</div>

					<div class="md-3">
						<label for="price" th:text="#{price}"></label>
						<input type="text" th:field="*{price}" class="form-control" disabled>
					</div>

					<div class="md-3">
						<label for="paymentDeadline" th:text="#{paymentDeadline}"></label>
						<input type="date" th:field="*{paymentDeadline}" class="form-control" disabled>
					</div>

				</div>
			</div>
		</div>
	</div>

	<script th:src="@{/webjars/bootstrap/js/bootstrap.bundle.min.js}"></script>

</body>

</html>
